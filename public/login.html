<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="login"><div class="shell narrow"><header></header><main>
<div id="msg"></div><div class="panel form"><h2>Login</h2><form id="loginForm"><input id="llogin" placeholder="Email or username" required><input id="lpass" type="password" placeholder="Password" required><button class="btn">Login</button></form>
<h2 style="margin-top:34px">Create account</h2><form id="regForm"><input id="rname" placeholder="Display name" maxlength="40"><input id="ruser" placeholder="Username (letters, numbers, _)" minlength="3" maxlength="20" required><input id="remail" type="email" placeholder="Email" required><input id="rpass" type="password" placeholder="Password (8+ chars)" minlength="8" required><button class="btn secondary">Sign up</button></form></div>
</main></div><script src="/js/app.js"></script></body></html>
